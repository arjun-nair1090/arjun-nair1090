<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Arjun Nair</title><desc id="d">Animated banner: five start lights go out, the name Arjun Nair comes up, and a timing tower lists Pit Wall, PurpleSector, APEX, FitRank and Resonance.</desc>
<style>
text{font-family:'Titillium Web','Barlow Semi Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono',Consolas,'SF Mono',Menlo,monospace}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes bar{from{transform:scaleX(0)}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.chip{opacity:0;animation:chip .5s ease-out forwards}@keyframes chip{from{opacity:0;translate:30px 0}to{opacity:1;translate:none}}
.streak{opacity:0;animation:streak 2.4s linear infinite}@keyframes streak{0%{opacity:0;transform:translateX(-240px)}15%{opacity:.8}60%{opacity:0;transform:translateX(620px)}100%{opacity:0;transform:translateX(620px)}}
.tick{animation:tick 40s linear infinite}@keyframes tick{to{transform:translateX(-2400px)}}
.live{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@keyframes l0{0%,5.70%{opacity:0}5.71%,69.99%{opacity:1}70.00%,100%{opacity:0}}.l0{animation:l0 7s infinite}
@keyframes l1{0%,16.42%{opacity:0}16.43%,69.99%{opacity:1}70.00%,100%{opacity:0}}.l1{animation:l1 7s infinite}
@keyframes l2{0%,27.13%{opacity:0}27.14%,69.99%{opacity:1}70.00%,100%{opacity:0}}.l2{animation:l2 7s infinite}
@keyframes l3{0%,37.85%{opacity:0}37.86%,69.99%{opacity:1}70.00%,100%{opacity:0}}.l3{animation:l3 7s infinite}
@keyframes l4{0%,48.56%{opacity:0}48.57%,69.99%{opacity:1}70.00%,100%{opacity:0}}.l4{animation:l4 7s infinite}
@keyframes go{0%,69.99%{opacity:0;transform:translateX(-14px)}72%{opacity:1;transform:none}92%{opacity:1}96%,100%{opacity:0}}.go{animation:go 7s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.chip,.streak,.go{opacity:1}}
</style>
<defs>
<pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#F0F0F5" opacity="0.02"/></pattern>
<radialGradient id="vignette" cx="25%" cy="0%" r="90%"><stop offset="0" stop-color="#E10600" stop-opacity="0.16"/><stop offset="0.55" stop-color="#E10600" stop-opacity="0"/></radialGradient>
<linearGradient id="towerbg" x1="0" x2="1"><stop offset="0" stop-color="#15151C"/><stop offset="1" stop-color="#101016"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="tickmask"><rect y="404" width="1200" height="56" fill="url(#fade)"/></mask></defs>

<rect width="1200" height="460" rx="14" fill="#0B0B0F"/>
<rect width="1200" height="460" rx="14" fill="url(#carbon)"/>
<rect width="1200" height="460" rx="14" fill="url(#vignette)"/>

<!-- speed streaks -->
<g stroke="#F0F0F5" stroke-linecap="round">
<line class="streak" x1="40" y1="186" x2="200" y2="186" stroke-width="1.5" style="animation-delay:.2s"/>
<line class="streak" x1="80" y1="262" x2="190" y2="262" stroke-width="1" style="animation-delay:1.1s"/>
<line class="streak" x1="20" y1="344" x2="220" y2="344" stroke-width="1" stroke="#E10600" style="animation-delay:1.7s"/>
</g>

<!-- header -->
<rect class="bar" x="64" y="44" width="56" height="4" fill="#E10600"/>
<text x="132" y="50" font-size="15" font-weight="700" letter-spacing="3" fill="#8A8A98">ARJUN-NAIR1090 · MUMBAI, IN</text>

<!-- start lights -->
<g transform="translate(64 78)">
<g fill="#1C1C24" stroke="#2A2A34"><rect x="0" width="36" height="36" rx="8"/><rect x="46" width="36" height="36" rx="8"/><rect x="92" width="36" height="36" rx="8"/><rect x="138" width="36" height="36" rx="8"/><rect x="184" width="36" height="36" rx="8"/></g>
<g fill="#2A0A0A"><circle cx="18" cy="18" r="11"/><circle cx="64" cy="18" r="11"/><circle cx="110" cy="18" r="11"/><circle cx="156" cy="18" r="11"/><circle cx="202" cy="18" r="11"/></g>
<g fill="#FF1E1E" stroke="#FF1E1E" stroke-opacity=".3" stroke-width="7"><circle class="l0" cx="18" cy="18" r="11"/><circle class="l1" cx="64" cy="18" r="11"/><circle class="l2" cx="110" cy="18" r="11"/><circle class="l3" cx="156" cy="18" r="11"/><circle class="l4" cx="202" cy="18" r="11"/></g>
<text class="go" x="240" y="25" font-size="17" font-weight="800" font-style="italic" letter-spacing="2" fill="#F0F0F5">LIGHTS OUT AND AWAY WE GO</text>
</g>

<!-- name -->
<g class="rise" style="animation-delay:.15s">
<text x="60" y="232" font-size="104" font-weight="900" font-style="italic" fill="#F0F0F5" textLength="610" lengthAdjust="spacingAndGlyphs">ARJUN NAIR</text>
</g>
<rect class="bar" x="64" y="250" width="200" height="6" fill="#E10600" style="animation-delay:.5s"/>
<rect class="bar" x="270" y="250" width="40" height="6" fill="#F0F0F5" style="animation-delay:.6s"/>
<rect class="bar" x="316" y="250" width="16" height="6" fill="#A855F7" style="animation-delay:.7s"/>

<g class="rise" style="animation-delay:.6s">
<text x="64" y="300" font-size="26" font-weight="700" fill="#E4E4EC">I build race-engineering software from raw telemetry.</text>
<text x="64" y="334" font-size="18" fill="#8A8A98">Full-stack · live data pipelines · simulation · apps on web, iOS, Android and Windows</text>
<text class="mono" x="64" y="372" font-size="15" fill="#6A6A78"><tspan fill="#A855F7">$</tspan> pytest backend <tspan fill="#22C55E">1,618 passed</tspan><tspan class="caret" fill="#F0F0F5"> ▍</tspan></text>
</g>

<!-- timing tower -->
<g transform="translate(784 44)">
<rect width="352" height="336" rx="10" fill="url(#towerbg)" stroke="#24242E"/>
<rect width="352" height="40" rx="10" fill="#E10600"/><rect y="30" width="352" height="10" fill="#E10600"/>
<text x="18" y="27" font-size="16" font-weight="800" letter-spacing="3" fill="#fff">THE GARAGE</text>
<circle class="live" cx="300" cy="20" r="5" fill="#fff"/><text x="312" y="26" font-size="13" font-weight="800" letter-spacing="1.5" fill="#fff">LIVE</text>

<g font-size="17" font-weight="700">
<g class="chip" style="animation-delay:.9s" transform="translate(0 52)">
<text x="18" y="27" fill="#8A8A98" class="mono" font-size="15">P1</text><rect x="52" y="8" width="4" height="26" fill="#E10600"/>
<text x="66" y="27" fill="#F0F0F5">PIT WALL</text><text x="334" y="27" text-anchor="end" class="mono" font-size="14" fill="#A855F7">1,618 tests</text></g>
<g class="chip" style="animation-delay:1.1s" transform="translate(0 108)">
<text x="18" y="27" fill="#8A8A98" class="mono" font-size="15">P2</text><rect x="52" y="8" width="4" height="26" fill="#A855F7"/>
<text x="66" y="27" fill="#F0F0F5">PURPLESECTOR</text><text x="334" y="27" text-anchor="end" class="mono" font-size="14" fill="#22C55E">v1.1.0 shipped</text></g>
<g class="chip" style="animation-delay:1.3s" transform="translate(0 164)">
<text x="18" y="27" fill="#8A8A98" class="mono" font-size="15">P3</text><rect x="52" y="8" width="4" height="26" fill="#F59E0B"/>
<text x="66" y="27" fill="#F0F0F5">APEX</text><text x="334" y="27" text-anchor="end" class="mono" font-size="14" fill="#E4E4EC">3 platforms</text></g>
<g class="chip" style="animation-delay:1.5s" transform="translate(0 220)">
<text x="18" y="27" fill="#8A8A98" class="mono" font-size="15">P4</text><rect x="52" y="8" width="4" height="26" fill="#22C55E"/>
<text x="66" y="27" fill="#F0F0F5">FITRANK</text><text x="334" y="27" text-anchor="end" class="mono" font-size="14" fill="#E4E4EC">Java + Postgres</text></g>
<g class="chip" style="animation-delay:1.7s" transform="translate(0 276)">
<text x="18" y="27" fill="#8A8A98" class="mono" font-size="15">P5</text><rect x="52" y="8" width="4" height="26" fill="#38BDF8"/>
<text x="66" y="27" fill="#F0F0F5">RESONANCE</text><text x="334" y="27" text-anchor="end" class="mono" font-size="14" fill="#E4E4EC">recsys + Redis</text></g>
</g>
<g stroke="#20202A"><line x1="14" y1="104" x2="338" y2="104"/><line x1="14" y1="160" x2="338" y2="160"/><line x1="14" y1="216" x2="338" y2="216"/><line x1="14" y1="272" x2="338" y2="272"/></g>
</g>

<!-- stack ticker -->
<rect y="404" width="1200" height="56" fill="#111117"/>
<rect y="404" width="1200" height="2" fill="#E10600"/>
<g mask="url(#tickmask)"><g class="tick" font-size="16" font-weight="800" letter-spacing="2" fill="#B8B8C4">
<text x="0" y="438" textLength="2400" lengthAdjust="spacing">PYTHON  ◆  TYPESCRIPT  ◆  FASTAPI  ◆  NEXT.JS  ◆  REACT  ◆  SWIFT  ◆  KOTLIN  ◆  C#  ◆  JAVA  ◆  POSTGRESQL  ◆  REDIS  ◆  DOCKER  ◆  PANDAS  ◆  FASTF1  ◆  WEBSOCKETS  ◆  GITHUB ACTIONS  ◆  </text>
<text x="2400" y="438" textLength="2400" lengthAdjust="spacing">PYTHON  ◆  TYPESCRIPT  ◆  FASTAPI  ◆  NEXT.JS  ◆  REACT  ◆  SWIFT  ◆  KOTLIN  ◆  C#  ◆  JAVA  ◆  POSTGRESQL  ◆  REDIS  ◆  DOCKER  ◆  PANDAS  ◆  FASTF1  ◆  WEBSOCKETS  ◆  GITHUB ACTIONS  ◆  </text>
</g></g>
</svg>
