<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Arjun Nair, Full-stack Software Engineer</title><desc id="d">Arjun Nair, full-stack software engineer. Builds real-time data platforms, tested APIs and native apps. 1,600+ automated tests, 7 languages, 4 platforms, 5 end-to-end products.</desc>
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}@keyframes rise{from{opacity:0;translate:0 18px}}
.cyc{animation:cyc 9s infinite backwards}@keyframes cyc{0%{opacity:0;translate:0 10px}4%,30%{opacity:1;translate:none}34%,100%{opacity:0;translate:0 -10px}}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.glow{animation:glow 6s ease-in-out infinite alternate}@keyframes glow{to{translate:120px 30px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cyc:not(.c0){opacity:0}}
</style>
<defs>
<linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="blob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
<clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
</defs>

<g clip-path="url(#card)">
<rect width="1200" height="320" fill="#0A0A0F"/>
<rect width="1200" height="320" fill="url(#grid)"/>
<ellipse class="glow" cx="260" cy="40" rx="420" ry="220" fill="url(#blob)"/>
<rect width="1200" height="3" fill="url(#accent)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="16" fill="none" stroke="#1F1F2A"/>

<g class="rise">
<text x="64" y="74" font-size="15" font-weight="600" letter-spacing="3" fill="#8B8B9A">SOFTWARE ENGINEER · MUMBAI, INDIA</text>
<text x="60" y="156" font-size="84" font-weight="800" fill="#F5F5F7" letter-spacing="-2">Arjun Nair</text>
</g>
<g class="rise" style="animation-delay:.15s">
<text x="64" y="200" font-size="26" font-weight="700" fill="url(#accent)">Full-stack · Backend · Real-time systems</text>
</g>
<g class="rise" style="animation-delay:.3s" font-size="21" fill="#C9C9D3">
<text x="64" y="252">I build</text>
<g transform="translate(142 0)" font-weight="600" fill="#F5F5F7">
<text class="cyc c0" y="252">real-time data platforms that stream to the browser</text>
<text class="cyc" y="252" style="animation-delay:3s">APIs backed by 1,600+ automated tests</text>
<text class="cyc" y="252" style="animation-delay:6s">native apps for iOS, Android and Windows</text>
</g>
</g>

<g class="rise" style="animation-delay:.45s" transform="translate(788 48)">
<g fill="#12121A" stroke="#23232F">
<rect width="164" height="104" rx="12"/><rect x="180" width="164" height="104" rx="12"/>
<rect y="120" width="164" height="104" rx="12"/><rect x="180" y="120" width="164" height="104" rx="12"/>
</g>
<g font-size="38" font-weight="800" fill="url(#accent)">
<text x="20" y="54">1,600+</text><text x="200" y="54">7</text><text x="20" y="174">4</text><text x="200" y="174">5</text>
</g>
<g font-size="14" fill="#8B8B9A">
<text x="20" y="82">automated tests</text><text x="200" y="82">languages shipped</text>
<text x="20" y="202">platforms</text><text x="200" y="202">end-to-end products</text>
</g>
</g>
</svg>
